
account_name: aatuu
data_dir: ./data
cache_dir: ./cache
cache_auto_age_minutes: 10
cookie_file: ./cookie.txt
cookie_max_age_days: 1
user_id_file: ./user_id.txt
base_url: "https://{account_name}.substack.com"
timeout: 30
headers:
  User-Agent: "Mozilla/5.0"

subscribers:
  url: "api/v1/subscriber-stats"
  method: post
  pagination: offset
  limit: 50
  items_field: subscribers
  sort_key: subscription_created_at
  body:
    filters:
      order_by_desc_nulls_last: subscription_created_at
    includeTags: true
  exclude:
    - user_photo_url

posts:
  url: "api/v1/posts"
  pagination: offset
  limit: 20
  sort_key: id
  exclude:
    - body_html
    - publishedBylines
    - truncated_body_text
    - inboxItem
    - podcastFields
    - podcastUpload
    - podcastPreviewUpload
    - videoUpload
    - voiceoverUpload
    - translation
    - postCountryBlocks
    - country_blocks
    - podcast_art_url
    - podcast_duration
    - podcast_preview_upload_id
    - podcast_upload_id
    - podcast_url

users:
  url: "api/v1/publication/users/ranked"
  sort_key: id
  params:
    public: true
  _include:
    - id
    - handle
    - name
    - bio
    - photo_url

notes:
  url: "https://substack.com/api/v1/reader/feed/profile/{user_id}"
  pagination: cursor
  cursor_field: nextCursor
  items_field: items
  filter:
    - type: comment
  sort_key: comment_date
  exclude:
    - comment:
      - attachments
      - body_json
      - ancestor_path
      - autotranslate_to
      - handle
      - is_ai_detection_disabled
      - media_clip_id
      - name
      - photo_url
      - post_id
      - publication_id
      - reply_minimum_role
      - translation
      - type
      - user_bestseller_tier
      - user_id
      - user_primary_publication
      - userStatus
    - context:
      - fallbackReason
      - fallbackUrl
      - isFresh
      - page
      - users
    - canReply
    - canShowCommentReveal
    - canShowFollowUpsell
    - dismissFeedbackOptions
    - isMuted
    - parentComments
    - post
    - publication
    - trackingParameters

replies:
  url: "https://substack.com/api/v1/reader/feed/profile/{user_id}"
  params:
    types[]: replies
  pagination: cursor
  cursor_field: nextCursor
  items_field: items
  sort_key: comment_date
  include:
    - entity_key
    - type
    - context:
        - type
        - timestamp
        - source
    - comment:
        - id
        - post_id
        - ancestor_path
        - body
        - date
        - edited_at
        - language
        - reaction_count
        - reactions
        - restacks
        - children_count
    - parentComments:
        - "[last]":
            - id
            - handle
            - name
            - body
        - "[first]":
            - id
            - handle
            - name
    - post:
        - id
        - title
        - slug
        - canonical_url
        - post_date
        - audience
        - type
        - wordcount
        - reaction_count
        - comment_count
    - publication:
        - id
        - name
        - subdomain
        - author_id
        - author_handle
        - author_name
